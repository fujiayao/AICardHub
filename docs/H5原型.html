<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数科 AI 智能名片｜H5 高保真原型</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#E9EDF2;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;color:#1A2433;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid #2F6BFF;outline-offset:2px;border-radius:4px}

.pt-head{height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;background:#13294B;color:#fff;position:sticky;top:0;z-index:50}
.pt-head b{font-size:16px;letter-spacing:.04em}
.pt-head .v{font-size:12px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.14);color:#D7E0EE}
.pt-head .note{margin-left:auto;font-size:12.5px;color:#AFC0D8}

.pt-main{display:grid;grid-template-columns:232px minmax(0,1fr) 360px;min-height:calc(100vh - 56px)}
#pt-nav{background:#fff;border-right:1px solid #DDE3EA;padding:14px 10px 40px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.pt-group{margin-top:14px}
.pt-gh{font-size:13px;font-weight:700;color:#13294B;padding:6px 10px}
.pt-gh small{display:block;font-weight:400;font-size:11.5px;color:#8D97A5;line-height:1.5;margin-top:2px}
.pt-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:14px;color:#3A4657}
.pt-item em{font-style:normal;font-size:11px;font-weight:700;color:#8D97A5;width:26px}
.pt-item:hover{background:#F3F5F8}
.pt-item.on{background:#EAF0FF;color:#2F6BFF;font-weight:600}
.pt-item.on em{color:#2F6BFF}
.pt-spec{border:1px dashed #C9D3E3}
.pt-states{display:flex;flex-wrap:wrap;gap:4px;padding:4px 10px 6px 44px}
.pt-states a{font-size:12px;padding:2px 8px;border-radius:999px;background:#F3F5F8;color:#5A6677}
.pt-states a.on{background:#13294B;color:#fff}

.pt-stage{display:flex;flex-direction:column;align-items:center;padding:16px 16px 40px}
#pt-bar{width:410px;max-width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pt-title{font-size:15px;font-weight:600;color:#13294B;display:flex;align-items:center;gap:8px}
.pt-title em{font-style:normal;font-size:12px;padding:1px 7px;border-radius:6px;background:#13294B;color:#fff}
.pt-title span{font-size:12px;font-weight:400;color:#5A6677;background:#fff;padding:1px 8px;border-radius:999px}
.pt-pn{display:flex;gap:6px}
.pt-pn a{width:32px;height:32px;border-radius:8px;background:#fff;display:grid;place-items:center;font-size:20px;color:#13294B;line-height:1}
.pt-phone{width:410px;height:864px;border-radius:54px;background:#0E1726;padding:10px;box-shadow:0 30px 60px rgba(19,41,75,.25),inset 0 0 0 2px #2A3546;flex:none}
#pt-screen{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:#F3F5F8;transform:translateZ(0)}
.sbar{position:absolute;top:0;left:0;right:0;height:44px;z-index:15;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 32px;font:600 15px/1 -apple-system,"SF Pro Text","PingFang SC",sans-serif;color:#0E1726;pointer-events:none}
.sbar.light{color:#fff}
.sbar-r{display:flex;gap:6px;align-items:center}
.sbar i{display:block;background:currentColor}
.sbar .sig{width:17px;height:10px;clip-path:polygon(0 70%,22% 70%,22% 100%,0 100%,0 70%,26% 50%,48% 50%,48% 100%,26% 100%,26% 50%,52% 28%,74% 28%,74% 100%,52% 100%,52% 28%,78% 0,100% 0,100% 100%,78% 100%,78% 0)}
.sbar .wifi{width:15px;height:11px;clip-path:polygon(50% 100%,0 30%,15% 15%,50% 0,85% 15%,100% 30%)}
.sbar .bat{width:24px;height:11px;border-radius:3px;background:none;border:1.5px solid currentColor;position:relative}
.sbar .bat::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1px}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#0E1726;z-index:45;pointer-events:none}

#pt-spec{background:#fff;border-left:1px solid #DDE3EA;padding:20px 22px 40px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;font-size:13.5px;line-height:1.7;color:#3A4657}
.pt-sh{display:flex;align-items:center;gap:10px}
.pt-sh em{font-style:normal;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:#13294B;color:#fff}
.pt-sh h2{margin:0;font-size:19px;color:#13294B}
.pt-route{display:flex;gap:8px;align-items:center;margin:12px 0 10px;font-size:12.5px;color:#8D97A5}
.pt-route code,.pt-api code{font-family:"Cascadia Code",Consolas,monospace;font-size:12px;background:#F3F5F8;color:#13294B;padding:2px 7px;border-radius:5px}
.pt-purpose{margin:0 0 4px;padding:10px 12px;border-radius:8px;background:#F3F5F8;color:#1A2433}
#pt-spec h4{margin:18px 0 6px;font-size:13px;color:#13294B}
#pt-spec ul{margin:0;padding-left:1.15em}
#pt-spec li{margin:3px 0}
.pt-api{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.pt-none{margin:0;color:#8D97A5}
.pt-statebar{display:flex;gap:6px;flex-wrap:wrap}
.pt-statebar a{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid #DDE3EA}
.pt-statebar a.on{background:#13294B;border-color:#13294B;color:#fff}

#pt-design{display:none}
body.pt-mode-spec .pt-stage,body.pt-mode-spec #pt-spec{display:none}
body.pt-mode-spec #pt-design{display:block;grid-column:2 / 4;padding:28px 36px 60px}
.ds{max-width:960px;background:transparent}
.ds h1{margin:0 0 8px;font-size:26px;color:#13294B}
.ds h2{margin:34px 0 12px;font-size:18px;color:#13294B}
.ds-lead{margin:0;color:#5A6677;max-width:44em}
.ds-rules{margin:0;padding-left:1.2em;color:#3A4657;line-height:1.8;max-width:56em}
.ds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ds-sw{background:#fff;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;font-size:12px;color:#5A6677}
.ds-sw i{height:48px;border-radius:8px;margin-bottom:6px}
.ds-sw b{font-size:13.5px;color:#13294B}
.ds-sw code{font-family:Consolas,monospace;font-size:11.5px;color:#13294B}
.ds-type{display:grid;grid-template-columns:1fr 110px 200px;gap:12px;align-items:baseline;padding:10px 14px;background:#fff;border-radius:10px;margin-bottom:6px;font-size:12.5px;color:#5A6677}
.ds-type code,.ds-rad code{font-family:Consolas,monospace;font-size:12px;color:#13294B}
.ds-grid-r{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.ds-rad{background:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:#5A6677}
.ds-rad i{width:64px;height:44px;background:#EAF0FF;border:1.5px solid #2F6BFF;margin-bottom:6px}
.ds-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ds-note{font-size:13px;color:#5A6677;margin:10px 0 0}
.ds-chat{max-width:420px;padding:16px;border-radius:14px;background:#F3F5F8}
.ds-icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ds-icons div{background:#fff;border-radius:10px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#13294B;font-size:11px}
.ds-icons span{color:#8D97A5;font-family:Consolas,monospace}
.ds-table{border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:13px;min-width:520px}
.ds-table th,.ds-table td{text-align:left;padding:8px 14px;border-bottom:1px solid #EEF1F5}
.ds-table th{background:#F3F5F8;color:#13294B}
.ds-table code{font-family:Consolas,monospace;font-size:12px;color:#13294B}

@media (max-width:1180px){
  .pt-head .v,.pt-head .note{display:none}
  .pt-main{grid-template-columns:232px minmax(0,1fr)}
  #pt-spec{grid-column:2;position:static;height:auto;border-left:0;border-top:1px solid #DDE3EA;margin:0 16px 24px;border-radius:14px}
  body.pt-mode-spec #pt-design{grid-column:2}
}
@media (max-width:760px){
  .pt-main{grid-template-columns:1fr}
  #pt-nav{position:static;height:auto;border-right:0;display:flex;gap:4px;overflow-x:auto;padding:8px}
  .pt-group{display:flex;gap:4px;margin:0}
  .pt-gh,.pt-states{display:none}
  .pt-item{white-space:nowrap}
  #pt-spec{grid-column:1}
  body.pt-mode-spec #pt-design{grid-column:1;padding:20px 16px}
  .pt-phone{transform:scale(.86);transform-origin:top center;margin-bottom:-120px}
}
/* =========================================================
   数科 AI 智能名片 · H5 原型
   第一部分：设计 tokens（开发时以此为准，映射到 Vant 4 主题变量）
   ========================================================= */
.app{
  /* 品牌与功能色 */
  --c-ink:#13294B;          /* 品牌深蓝：名字、标题、名片底色 */
  --c-ink-2:#22406E;        /* 品牌深蓝·浅：渐变、次级深色面 */
  --c-primary:#2F6BFF;      /* 主操作：按钮、链接、选中 */
  --c-primary-press:#1F56E0;
  --c-primary-soft:#EAF0FF;
  --c-ai:#0E9E98;           /* AI 分身身份色：AI 头像、AI 标识、试聊 */
  --c-ai-soft:#E2F5F3;
  --c-amber:#E08A1E;        /* 提醒：A 级意向、超时未读、新线索 */
  --c-amber-soft:#FDF2E2;
  --c-danger:#E5484D;       /* 错误、删除、未读角标 */
  --c-danger-soft:#FDECEC;
  --c-success:#1E9E5A;
  --c-success-soft:#E6F6EC;
  /* 中性色 */
  --c-bg:#F3F5F8;
  --c-surface:#FFFFFF;
  --c-line:#E5E9EF;
  --c-text:#1A2433;
  --c-text-2:#5A6677;
  --c-text-3:#8D97A5;
  /* 字号 */
  --fs-xs:12px; --fs-sm:13px; --fs-base:15px; --fs-md:17px; --fs-lg:20px; --fs-xl:24px; --fs-xxl:30px;
  /* 圆角 */
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px; --r-pill:999px;
  /* 阴影：只有“浮起”的元素用阴影，普通卡片用描边 */
  --sh-float:0 10px 30px rgba(19,41,75,.16);
  --sh-soft:0 2px 8px rgba(19,41,75,.06);
  /* 字体 */
  --font:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --font-num:"DIN Alternate","Roboto","PingFang SC",system-ui,sans-serif;

  font-family:var(--font); font-size:var(--fs-base); line-height:1.6; color:var(--c-text);
  -webkit-font-smoothing:antialiased;
}
.app *{box-sizing:border-box}
:where(.app) button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.app input,.app textarea{font:inherit;color:var(--c-text)}
.app svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app svg.i.s16{width:16px;height:16px}
.app svg.i.s18{width:18px;height:18px}
.app svg.i.s24{width:24px;height:24px}
.app .num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.app [data-go]{cursor:pointer}

/* ---------- 页面骨架 ---------- */
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--c-bg);padding-top:44px}
.page.immersive{padding-top:0}
.page.white{background:var(--c-surface)}
.page-body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.page-body::-webkit-scrollbar{display:none}
.pad{padding:0 16px}
.sec{margin-top:12px}
.sec-title{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 10px;font-size:var(--fs-md);font-weight:600;color:var(--c-ink)}
.sec-title small{font-size:var(--fs-sm);font-weight:400;color:var(--c-text-3)}
.sec-title a{font-size:var(--fs-sm);font-weight:400;color:var(--c-primary);display:flex;align-items:center;gap:2px;cursor:pointer}
.muted{color:var(--c-text-2)}
.faint{color:var(--c-text-3)}
.hint{font-size:var(--fs-xs);color:var(--c-text-3);line-height:1.5}

/* 导航栏 */
.nav{height:48px;flex:none;display:grid;grid-template-columns:88px 1fr 88px;align-items:center;background:var(--c-surface);position:relative;z-index:3}
.nav.clear{background:transparent}
.nav.line{border-bottom:1px solid var(--c-line)}
.nav-title{text-align:center;font-size:var(--fs-md);font-weight:600;color:var(--c-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-l,.nav-r{display:flex;align-items:center;gap:14px;padding:0 14px;color:var(--c-ink)}
.nav-r{justify-content:flex-end;white-space:nowrap}
.nav-big{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--c-bg);flex:none}
.nav-big h1{margin:0;font-size:var(--fs-xl);font-weight:700;color:var(--c-ink);letter-spacing:.02em}

/* 消息铃铛 */
.bell{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--c-surface);color:var(--c-ink);cursor:pointer}
.badge{position:absolute;top:2px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--c-danger);color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:600;border:1.5px solid #fff}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c-danger)}

/* 底部 Tab 栏 */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--c-surface);border-top:1px solid var(--c-line);padding:6px 0 24px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--c-text-3);cursor:pointer;position:relative}
.tab svg.i{width:24px;height:24px}
.tab.on{color:var(--c-primary);font-weight:600}

/* 底部操作栏 */
.actionbar{flex:none;display:flex;gap:10px;align-items:center;padding:10px 16px 28px;background:var(--c-surface);border-top:1px solid var(--c-line)}

/* ---------- 按钮 ---------- */
.btn{height:40px;padding:0 18px;border-radius:var(--r-md);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:var(--fs-base);font-weight:600;white-space:nowrap;transition:background .15s}
.btn-lg{height:48px;border-radius:12px;font-size:var(--fs-md)}
.btn-sm{height:30px;padding:0 12px;font-size:var(--fs-sm);border-radius:8px}
.btn-block{width:100%}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-primary:active{background:var(--c-primary-press)}
.btn-ai{background:var(--c-ai);color:#fff}
.btn-ink{background:var(--c-ink);color:#fff}
.btn-ghost{background:var(--c-surface);color:var(--c-ink);border:1px solid var(--c-line)}
.btn-soft{background:var(--c-primary-soft);color:var(--c-primary)}
.btn-ai-soft{background:var(--c-ai-soft);color:var(--c-ai)}
.btn-danger-text{color:var(--c-danger)}
.btn[disabled],.btn.disabled{opacity:.4;pointer-events:none}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--c-bg);color:var(--c-ink)}

/* ---------- 列表单元 / 表单 ---------- */
.group{margin:0 16px;background:var(--c-surface);border-radius:var(--r-lg);overflow:hidden}
.cell{min-height:52px;display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative}
.cell + .cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--c-line)}
.cell-label{flex:none;width:72px;color:var(--c-text);font-size:var(--fs-base)}
.cell-label.req::after{content:"*";color:var(--c-danger);margin-left:2px}
.cell-main{flex:1;min-width:0}
.cell-title{font-size:var(--fs-base);color:var(--c-text)}
.cell-desc{font-size:var(--fs-sm);color:var(--c-text-3);margin-top:2px;line-height:1.5}
.cell-value{color:var(--c-text-2);font-size:var(--fs-base);text-align:right;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .arrow{color:#B8C0CB}
.cell-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:var(--fs-base);padding:0}
.input::placeholder,.textarea::placeholder{color:#B3BBC6}
.locked{display:flex;align-items:center;gap:4px;color:var(--c-text-3);font-size:var(--fs-sm)}
.textarea{width:100%;border:0;outline:0;resize:none;background:var(--c-bg);border-radius:var(--r-md);padding:10px 12px;font-size:var(--fs-base);line-height:1.6;min-height:96px}
.counter{text-align:right;font-size:var(--fs-xs);color:var(--c-text-3);margin-top:4px}
.field-box{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:12px;background:var(--c-bg);border:1px solid transparent}
.field-box.focus{border-color:var(--c-primary);background:#fff}
.field-err{font-size:var(--fs-xs);color:var(--c-danger);margin-top:6px}
.switch{width:44px;height:26px;border-radius:13px;background:#D5DBE3;position:relative;flex:none;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.switch.on{background:var(--c-primary)}
.switch.on::after{left:21px}
.check{width:18px;height:18px;border-radius:5px;border:1.5px solid #C3CAD4;display:grid;place-items:center;flex:none;color:#fff}
.check.on{background:var(--c-primary);border-color:var(--c-primary)}
.check svg.i{width:12px;height:12px;stroke-width:3}

/* ---------- 标签 / 胶囊 ---------- */
.tag{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;border-radius:var(--r-sm);font-size:11px;font-weight:600;white-space:nowrap}
.tag-gray{background:#EEF1F5;color:var(--c-text-2)}
.tag-primary{background:var(--c-primary-soft);color:var(--c-primary)}
.tag-ai{background:var(--c-ai-soft);color:var(--c-ai)}
.tag-amber{background:var(--c-amber-soft);color:#B76B0B}
.tag-danger{background:var(--c-danger-soft);color:var(--c-danger)}
.tag-success{background:var(--c-success-soft);color:var(--c-success)}
.lv{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--font-num)}
.lv-A{background:var(--c-amber);color:#fff}
.lv-B{background:var(--c-primary-soft);color:var(--c-primary)}
.lv-C{background:#EEF1F5;color:var(--c-text-3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r-pill);background:var(--c-surface);border:1px solid var(--c-line);font-size:var(--fs-sm);color:var(--c-ink);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--c-ink);border-color:var(--c-ink);color:#fff}
.chip-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.chip-row::-webkit-scrollbar{display:none}

/* 分段控件 */
.seg{display:flex;background:#E8ECF1;border-radius:10px;padding:3px;margin:0 16px}
.seg span{flex:1;text-align:center;height:32px;line-height:32px;border-radius:8px;font-size:var(--fs-sm);color:var(--c-text-2);cursor:pointer}
.seg span.on{background:#fff;color:var(--c-ink);font-weight:600;box-shadow:var(--sh-soft)}
/* 下划线 Tab */
.utabs{display:flex;gap:24px;padding:0 16px;border-bottom:1px solid var(--c-line);background:var(--c-surface)}
.utabs span{height:44px;line-height:44px;font-size:var(--fs-base);color:var(--c-text-2);position:relative;cursor:pointer}
.utabs span.on{color:var(--c-ink);font-weight:600}
.utabs span.on::after{content:"";position:absolute;left:50%;bottom:0;width:20px;height:3px;border-radius:2px;background:var(--c-primary);transform:translateX(-50%)}

/* ---------- 头像与职业照 ---------- */
.avatar{border-radius:50%;overflow:hidden;flex:none;background:var(--c-ink-2);display:grid;place-items:center;color:#fff;font-weight:600}
.avatar svg.photo{width:100%;height:100%;display:block}
.avatar-ai{position:relative}
.avatar-ai::after{content:"";position:absolute;right:0;bottom:0;width:28%;height:28%;border-radius:50%;background:var(--c-ai);border:2px solid #fff}
.anon{background:#E4E9F0;color:var(--c-text-2);font-size:var(--fs-sm)}

/* ---------- 对话 ---------- */
.chat{padding:12px 16px 20px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%}
.msg.me{flex-direction:row-reverse}
.bubble{max-width:82%;padding:10px 13px;border-radius:16px;font-size:var(--fs-base);line-height:1.65;word-break:break-word}
.msg.ai .bubble{background:var(--c-surface);border-top-left-radius:4px;color:var(--c-text);box-shadow:var(--sh-soft)}
.msg.me .bubble{background:var(--c-primary);color:#fff;border-top-right-radius:4px}
.bubble ul{margin:6px 0 2px;padding-left:1.2em}
.bubble li{margin:2px 0}
.bubble b{color:var(--c-ink)}
.msg-tools{display:flex;gap:14px;margin:6px 0 0 2px;color:var(--c-text-3);font-size:var(--fs-xs);align-items:center}
.msg-tools span{display:inline-flex;align-items:center;gap:3px;cursor:pointer}
.ai-mark{display:flex;align-items:center;gap:3px;font-size:10.5px;color:var(--c-ai);font-weight:600;margin-bottom:3px}
.cursor{display:inline-block;width:7px;height:15px;background:var(--c-ai);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.chat-time{align-self:center;font-size:var(--fs-xs);color:var(--c-text-3)}
.chat-input{flex:none;background:var(--c-surface);border-top:1px solid var(--c-line);padding:8px 12px 28px}
.chat-input .row{display:flex;gap:8px;align-items:center}
.chat-input .box{flex:1;height:42px;border-radius:21px;background:var(--c-bg);display:flex;align-items:center;padding:0 16px;color:#A7B0BC;font-size:var(--fs-base)}
.send{width:42px;height:42px;border-radius:50%;background:var(--c-primary);color:#fff;display:grid;place-items:center;flex:none}
.send.off{background:#C9D3E3}
.disclaimer{text-align:center;font-size:11px;color:var(--c-text-3);padding-top:6px}

/* ---------- 弹层 ---------- */
.mask{position:absolute;inset:0;background:rgba(10,20,38,.5);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--c-surface);border-radius:20px 20px 0 0;z-index:21;padding:8px 0 28px;max-height:86%;display:flex;flex-direction:column}
.sheet-grip{width:36px;height:4px;border-radius:2px;background:#D9DEE5;margin:0 auto 6px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 12px}
.sheet-head h3{margin:0;font-size:var(--fs-md);color:var(--c-ink)}
.sheet-body{overflow-y:auto;padding:0 16px}
.toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:rgba(20,30,48,.88);color:#fff;font-size:var(--fs-sm);padding:10px 16px;border-radius:10px;z-index:40;display:flex;align-items:center;gap:6px;white-space:nowrap}

/* ---------- 空状态 / 结果页 ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 32px;color:var(--c-text-3);font-size:var(--fs-sm)}
.empty .ill{width:72px;height:72px;border-radius:24px;background:var(--c-surface);display:grid;place-items:center;color:var(--c-text-3);margin-bottom:12px}

/* ---------- 统计 ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{padding:14px 0;text-align:center;position:relative}
.stat + .stat::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:1px;background:var(--c-line)}
.stat b{display:block;font-family:var(--font-num);font-size:24px;line-height:1.2;color:var(--c-ink);font-weight:700}
.stat span{font-size:var(--fs-xs);color:var(--c-text-3)}
.stat em{font-style:normal;font-size:11px;color:var(--c-success);margin-left:2px}

/* =========================================================
   访客名片 A1
   ========================================================= */
.vc-hero{position:relative;height:440px;flex:none;background:linear-gradient(165deg,#2C4E80 0%,#13294B 70%);overflow:hidden}
.vc-hero svg.photo{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:100%;width:auto}
.vc-hero::after{content:"";position:absolute;inset:auto 0 0 0;height:58%;background:linear-gradient(180deg,rgba(19,41,75,0) 0%,rgba(19,41,75,.82) 62%,#13294B 100%)}
.vc-top{position:absolute;top:52px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.logo-chip{display:flex;align-items:center;gap:8px;color:#fff;font-weight:600;font-size:var(--fs-sm);letter-spacing:.06em}
.logo-mark{width:28px;height:28px;border-radius:8px;background:#fff;display:grid;place-items:center}
.glass{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff;cursor:pointer}
.vc-id{position:absolute;left:20px;right:20px;bottom:44px;z-index:2;color:#fff}
.vc-name{font-size:var(--fs-xxl);font-weight:700;letter-spacing:.06em;line-height:1.2}
.vc-title{margin-top:6px;font-size:var(--fs-base);color:#D3DDEC}
.vc-co{margin-top:2px;font-size:var(--fs-sm);color:#9FB2CF}
.vc-sheet{position:relative;margin-top:-24px;background:var(--c-bg);border-radius:20px 20px 0 0;z-index:2;padding-top:16px}

/* AI 分身入口：整张名片最醒目的元素 */
.ai-entry{margin:0 16px;border-radius:18px;background:var(--c-surface);padding:16px;box-shadow:var(--sh-float);position:relative;overflow:hidden}
.ai-entry::before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(14,158,152,.18),rgba(14,158,152,0) 70%)}
.ai-who{display:flex;align-items:center;gap:10px;position:relative}
.ai-who b{font-size:var(--fs-base);color:var(--c-ink)}
.online{display:flex;align-items:center;gap:5px;font-size:var(--fs-xs);color:var(--c-ai)}
.online::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c-ai);box-shadow:0 0 0 3px rgba(14,158,152,.18)}
.ai-say{margin:12px 0 12px;padding:10px 12px;border-radius:4px 14px 14px 14px;background:var(--c-ai-soft);color:#0B4F4C;font-size:var(--fs-base);line-height:1.6;position:relative}
.ai-qs{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;position:relative}
.ai-q{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;background:var(--c-bg);font-size:var(--fs-sm);color:var(--c-ink);cursor:pointer}
.ai-q svg.i{color:var(--c-text-3)}
.ai-ask{display:flex;align-items:center;gap:8px;height:46px;padding:0 6px 0 16px;border-radius:23px;border:1.5px solid var(--c-ai);color:var(--c-text-3);font-size:var(--fs-base);cursor:pointer;position:relative;background:#fff}
.ai-ask span{flex:1}
.ai-ask i{width:36px;height:36px;border-radius:50%;background:var(--c-ai);color:#fff;display:grid;place-items:center}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 16px 0;padding:14px 4px;background:var(--c-surface);border-radius:var(--r-lg)}
.quick div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--c-text-2);cursor:pointer}
.quick i{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--c-primary-soft);color:var(--c-primary);font-style:normal}

.contact .cell-ico{background:var(--c-bg);color:var(--c-ink)}
.contact .act{font-size:var(--fs-sm);color:var(--c-primary);display:flex;align-items:center;gap:3px;cursor:pointer}

.co-card{margin:0 16px;background:var(--c-surface);border-radius:var(--r-lg);padding:16px}
.co-head{display:flex;align-items:center;gap:10px}
.co-logo{width:40px;height:40px;border-radius:10px;background:var(--c-ink);display:grid;place-items:center;flex:none}
.co-head b{display:block;color:var(--c-ink);font-size:var(--fs-base)}
.co-intro{margin-top:10px;font-size:var(--fs-sm);color:var(--c-text-2);line-height:1.7}
.more-link{font-size:var(--fs-sm);color:var(--c-primary);cursor:pointer}

.prod-row{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none;scroll-snap-type:x mandatory;scroll-padding:0 16px}
.prod-row::-webkit-scrollbar{display:none}
.prod{flex:none;width:236px;border-radius:var(--r-lg);background:var(--c-surface);overflow:hidden;scroll-snap-align:start}
.prod-img{height:104px;position:relative;overflow:hidden}
.prod-img span{position:absolute;left:12px;bottom:10px;color:#fff;font-weight:700;font-size:var(--fs-md);letter-spacing:.04em}
.prod-body{padding:10px 12px 12px}
.prod-body p{margin:0 0 8px;font-size:var(--fs-sm);color:var(--c-text-2);line-height:1.55;height:40px;overflow:hidden}
.ask{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-sm);font-weight:600;color:var(--c-ai);cursor:pointer}

.vc-foot{text-align:center;padding:24px 16px 20px;font-size:var(--fs-xs);color:var(--c-text-3)}
.vc-foot a{color:var(--c-primary);cursor:pointer}

.vc-bar{flex:none;display:flex;gap:8px;align-items:center;padding:10px 16px 28px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--c-line)}
.vc-bar .mini{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:var(--c-text-2);width:48px;cursor:pointer}
.vc-bar .btn{flex:1}

/* 微信浏览器引导浮层 */
.wx-guide{position:absolute;inset:0;z-index:30;background:rgba(8,16,30,.9);color:#fff;padding:14px 18px 0 28px;text-align:right}
.wx-guide .arrow-up{display:inline-block;margin-right:6px}
.wx-guide h4{text-align:left;font-size:var(--fs-lg);margin:22px 0 10px;font-weight:600}
.wx-guide p{text-align:left;font-size:var(--fs-base);line-height:1.8;color:#D7E0EE;margin:0}
.wx-guide .menu-mock{display:inline-flex;gap:3px;padding:6px 10px;border-radius:14px;background:rgba(255,255,255,.18);margin:0 3px;vertical-align:middle}
.wx-guide .menu-mock i{width:4px;height:4px;border-radius:50%;background:#fff}
.wx-guide .alt{margin-top:40px;text-align:left;padding:14px;border-radius:14px;background:rgba(255,255,255,.1)}

/* =========================================================
   对话页 A2
   ========================================================= */
.chat-page{background:linear-gradient(180deg,#EAF2F6 0%,var(--c-bg) 260px)}
.chat-head{display:flex;align-items:center;gap:10px;justify-content:center}
.chat-head .t b{display:block;font-size:var(--fs-base);color:var(--c-ink);line-height:1.3}
.chat-head .t span{display:block;font-size:11px;color:var(--c-text-3);line-height:1.3}
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 24px 8px}
.welcome .avatar{box-shadow:0 0 0 4px #fff,0 10px 24px rgba(19,41,75,.16)}
.welcome h2{margin:14px 0 4px;font-size:var(--fs-lg);color:var(--c-ink)}
.welcome p{margin:0;font-size:var(--fs-sm);color:var(--c-text-2)}
.guide-list{margin:4px 16px 0;display:flex;flex-direction:column;gap:8px}
.guide-list .lbl{font-size:var(--fs-xs);color:var(--c-text-3);margin:6px 2px 0}
.guide-q{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--c-surface);font-size:var(--fs-base);color:var(--c-ink);cursor:pointer;box-shadow:var(--sh-soft)}
.guide-q svg.i{color:var(--c-ai)}
.lead-card{margin-left:44px;padding:14px;border-radius:14px;background:var(--c-surface);border:1px solid #F3D9B3;box-shadow:var(--sh-soft)}
.lead-card b{display:block;color:var(--c-ink);font-size:var(--fs-base)}
.lead-card p{margin:4px 0 12px;font-size:var(--fs-sm);color:var(--c-text-2)}
.lead-card .row{display:flex;gap:8px}
.lead-card .btn{flex:1}
.privacy{display:flex;gap:8px;align-items:flex-start;font-size:var(--fs-xs);color:var(--c-text-2);line-height:1.6;margin:14px 0 16px}
.privacy a{color:var(--c-primary)}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:var(--fs-sm);color:var(--c-text-2);margin-bottom:6px}
.form-row label em{color:var(--c-danger);font-style:normal;margin-left:2px}

/* 结果页 */
.result{display:flex;flex-direction:column;align-items:center;text-align:center;padding:72px 28px 24px}
.result .ok{width:72px;height:72px;border-radius:50%;background:var(--c-success-soft);color:var(--c-success);display:grid;place-items:center}
.result .ok svg.i{width:36px;height:36px;stroke-width:2.4}
.result h2{margin:18px 0 6px;font-size:var(--fs-lg);color:var(--c-ink)}
.result p{margin:0;font-size:var(--fs-base);color:var(--c-text-2);line-height:1.7}
.summary-box{margin:24px 16px 0;padding:14px 16px;border-radius:var(--r-lg);background:var(--c-surface);font-size:var(--fs-sm);color:var(--c-text-2);text-align:left}
.summary-box div{display:flex;justify-content:space-between;padding:4px 0}
.summary-box div b{color:var(--c-text);font-weight:500}

/* =========================================================
   员工端
   ========================================================= */
/* 实体名片卡面（B2、B4 海报等） */
.card-face{margin:0 16px;height:206px;border-radius:18px;background:linear-gradient(135deg,#1C3762 0%,#13294B 60%,#0F2140 100%);color:#fff;position:relative;overflow:hidden;padding:20px;box-shadow:0 14px 30px rgba(19,41,75,.28)}
.card-face::before{content:"";position:absolute;right:-60px;bottom:-80px;width:240px;height:240px;border-radius:50%;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 30px rgba(255,255,255,.03),0 0 0 60px rgba(255,255,255,.02)}
.card-face .cf-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.card-face .cf-name{font-size:26px;font-weight:700;letter-spacing:.08em}
.card-face .cf-title{font-size:var(--fs-sm);color:#B9C8DE;margin-top:4px}
.card-face .cf-photo{width:64px;height:64px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.7)}
.card-face .cf-info{position:absolute;left:20px;bottom:18px;font-size:var(--fs-xs);color:#C9D5E7;line-height:1.9}
.card-face .cf-info div{display:flex;align-items:center;gap:6px}
.card-face .cf-brand{position:absolute;right:20px;bottom:18px;display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:600;letter-spacing:.1em}
.nfc-wave{color:#5ED3CD}
.card-ops{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 16px 0}
.panel{margin:0 16px;background:var(--c-surface);border-radius:var(--r-lg);padding:14px 16px}
.panel-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.panel-h b{color:var(--c-ink);font-size:var(--fs-base)}
.bars{display:flex;align-items:flex-end;gap:10px;height:72px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;max-width:22px;border-radius:5px 5px 2px 2px;background:#D6E2FF}
.bars i.hi{background:var(--c-primary)}
.bars span{font-size:10px;color:var(--c-text-3)}
.vis-item{display:flex;gap:12px;align-items:center;padding:12px 16px;position:relative;cursor:pointer}
.vis-item + .vis-item::before{content:"";position:absolute;top:0;left:60px;right:0;height:1px;background:var(--c-line)}
.vis-item .avatar{width:36px;height:36px}
.vis-main{flex:1;min-width:0}
.vis-main .l1{display:flex;align-items:center;gap:6px;font-size:var(--fs-base);color:var(--c-text)}
.vis-main .l2{font-size:var(--fs-sm);color:var(--c-text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vis-side{text-align:right;font-size:var(--fs-xs);color:var(--c-text-3);flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.banner{margin:12px 16px 0;padding:10px 12px;border-radius:12px;display:flex;align-items:center;gap:8px;font-size:var(--fs-sm)}
.banner-ai{background:var(--c-ai-soft);color:#0B5E5A}
.banner-amber{background:var(--c-amber-soft);color:#8A520A}
.banner .grow{flex:1}

/* AI 助手页 */
.ai-status{margin:4px 16px 0;border-radius:18px;padding:16px;background:linear-gradient(140deg,#0E9E98 0%,#0B7F8B 100%);color:#fff;position:relative;overflow:hidden}
.ai-status::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08)}
.ai-status .top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.ai-status .top b{display:block;font-size:var(--fs-md)}
.ai-status .top span{font-size:var(--fs-xs);color:#CDEFEC}
.ai-status .nums{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;position:relative;z-index:1}
.ai-status .nums div{font-size:11px;color:#CDEFEC}
.ai-status .nums b{display:block;font-family:var(--font-num);font-size:22px;color:#fff;line-height:1.3}
.block{margin:12px 16px 0;background:var(--c-surface);border-radius:var(--r-lg);padding:14px 16px}
.block-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.block-h b{font-size:var(--fs-base);color:var(--c-ink);display:flex;align-items:center;gap:6px}
.block-h .acts{display:flex;gap:14px;font-size:var(--fs-sm);color:var(--c-primary)}
.block-h .acts span{display:flex;align-items:center;gap:3px;cursor:pointer}
.block p.txt{margin:0;font-size:var(--fs-sm);color:var(--c-text-2);line-height:1.7}
.tpl-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;background:var(--c-bg);font-size:var(--fs-sm);color:var(--c-ink);margin-bottom:8px}
.q-list{display:flex;flex-direction:column;gap:8px}
.q-item{display:flex;align-items:center;gap:10px;font-size:var(--fs-sm);color:var(--c-text)}
.q-item.off{color:var(--c-text-3)}

/* 知识 */
.kb-item{display:flex;gap:12px;padding:14px 16px;position:relative;cursor:pointer}
.kb-item + .kb-item::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--c-line)}
.kb-ico{width:38px;height:44px;border-radius:8px;background:var(--c-primary-soft);color:var(--c-primary);display:grid;place-items:center;flex:none;font-size:10px;font-weight:700}
.kb-main{flex:1;min-width:0}
.kb-main b{display:block;font-size:var(--fs-base);color:var(--c-text);font-weight:500}
.kb-main p{margin:2px 0 4px;font-size:var(--fs-sm);color:var(--c-text-3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kb-meta{font-size:11px;color:var(--c-text-3);display:flex;gap:10px}
.md-toolbar{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--c-line);color:var(--c-text-2)}
.md-toolbar span{width:32px;height:30px;display:grid;place-items:center;border-radius:6px;font-size:var(--fs-sm);font-weight:700}
.md-area{font-family:"SF Mono","Cascadia Code",Consolas,var(--font);font-size:var(--fs-sm);line-height:1.8;color:var(--c-text);padding:12px 14px;white-space:pre-wrap;min-height:280px}
.md-area .h{color:var(--c-ink);font-weight:700}
.md-area .m{color:var(--c-text-3)}

.file-up{margin:12px 16px 0;padding:14px;border-radius:var(--r-lg);background:var(--c-surface);display:flex;gap:12px;align-items:center}
.file-up .ft{width:40px;height:48px;border-radius:8px;background:#FDECEC;color:var(--c-danger);display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}
.progress{height:4px;border-radius:2px;background:var(--c-line);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--c-success);width:100%}
.draft{margin:12px 16px 0;background:var(--c-surface);border-radius:var(--r-lg);overflow:hidden;border:1.5px solid transparent}
.draft.on{border-color:var(--c-primary)}
.draft-h{display:flex;gap:10px;align-items:flex-start;padding:14px 16px 10px}
.draft-h b{display:block;font-size:var(--fs-base);color:var(--c-ink)}
.draft-h p{margin:2px 0 0;font-size:var(--fs-sm);color:var(--c-text-3);line-height:1.5}

.qa .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--c-line);font-size:var(--fs-xs);color:var(--c-text-3)}
.wrong{margin:8px 0 0 28px;padding:8px 10px;border-radius:8px;background:var(--c-danger-soft);font-size:var(--fs-xs);color:#9B3134;line-height:1.6}

.lead-item{margin:10px 16px 0;background:var(--c-surface);border-radius:var(--r-lg);padding:14px 16px;cursor:pointer}

.lead-item .l2{margin-top:6px;font-size:var(--fs-sm);color:var(--c-text-2);display:flex;gap:12px}

.lead-item .l3{margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-xs);color:var(--c-text-3)}
.overdue{color:var(--c-amber);font-weight:600;display:inline-flex;align-items:center;gap:3px}
.st{font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--r-pill)}
.st-new{background:var(--c-amber-soft);color:#B76B0B}
.st-contacted{background:var(--c-primary-soft);color:var(--c-primary)}
.st-converted{background:var(--c-success-soft);color:var(--c-success)}
.st-invalid{background:#EEF1F5;color:var(--c-text-3)}

.v-head{margin:4px 16px 0;background:var(--c-surface);border-radius:var(--r-lg);padding:16px}
.v-head .l1{display:flex;gap:12px;align-items:center}
.v-head .l1 b{font-size:var(--fs-lg);color:var(--c-ink)}
.v-head .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:12px;font-size:var(--fs-sm)}
.v-head .kv span{color:var(--c-text-3)}

.ai-sum{margin:12px 16px 0;border-radius:var(--r-lg);padding:14px 16px;background:var(--c-ai-soft)}
.ai-sum .h{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:600;color:var(--c-ai);margin-bottom:6px}

.ai-sum .tags span{font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.7);color:#0B5E5A}
.timeline{margin:0 16px;background:var(--c-surface);border-radius:var(--r-lg);padding:14px 16px 4px}
.tl{display:flex;gap:12px;position:relative;padding-bottom:14px}
.tl::before{content:"";position:absolute;left:5px;top:14px;bottom:0;width:1.5px;background:var(--c-line)}
.tl:last-child::before{display:none}
.tl i{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--c-primary);background:#fff;flex:none;margin-top:5px}
.tl.amber i{border-color:var(--c-amber)}
.tl.ai i{border-color:var(--c-ai)}
.tl b{display:block;font-size:var(--fs-sm);color:var(--c-text);font-weight:500}
.tl span{font-size:var(--fs-xs);color:var(--c-text-3)}
.mini-chat{margin:0 16px;background:var(--c-surface);border-radius:var(--r-lg);padding:4px 0}
.mini-chat .chat{gap:12px;padding:12px}

.mini-chat .msg.ai .bubble{background:var(--c-bg);box-shadow:none}
.status-opt{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--c-line);cursor:pointer}
.status-opt:last-child{border-bottom:0}
.status-opt .grow{flex:1}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid #C3CAD4;flex:none;position:relative}
.radio.on{border-color:var(--c-primary)}
.radio.on::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--c-primary)}

.me-head b{display:block;font-size:var(--fs-lg);color:var(--c-ink)}
.me-head span{font-size:var(--fs-sm);color:var(--c-text-3)}

.poster .pb p b{display:block;font-size:var(--fs-sm);color:var(--c-ink)}
.link-box{width:100%;padding:14px;border-radius:12px;background:var(--c-bg);font-size:var(--fs-sm);line-height:1.7;color:var(--c-text);word-break:break-all}

/* ---------- 二维码占位（开发时用 qrcode 库生成） ---------- */
function qrSvg(seed=7){
  const n=25; let s=seed*9301+49297, d='';
  const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
  const finder=(x,y)=>x<7&&y<7||x>=n-7&&y<7||x<7&&y>=n-7;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    if(finder(x,y))continue;
    if(x>9&&x<15&&y>9&&y<15)continue;
    if(rnd()>.52)d+=`M${x} ${y}h1v1h-1z`;
  }
  const f=(x,y)=>`<path d="M${x} ${y}h7v7h-7zM${x+1} ${y+1}v5h5v-5z" fill-rule="evenodd"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return `<svg viewBox="0 0 25 25" shape-rendering="crispEdges" fill="#13294B"><path d="${d}"/>${f(0,0)}${f(18,0)}${f(0,18)}</svg>`;
}

    ${item('lead','新线索：王先生','留下了联系方式：想了解产品 A 私有化部署，下月内部选型','10:32',true,'B11')}
    ${item('intent','高意向访客','访客 #7B12 连续询问产品 B 的报价和交付周期，聊了 8 轮','09:58',true,'B11')}
    ${item('digest','昨日汇总','23 位访客、9 次对话、2 条新线索。B 级意向 3 人：访客 #3F2A 等','09:00',true,'B10/visitors')}
    <div class="day">昨天</div>
    ${item('lead','新线索：李女士','需要一份仓储环节的方案和报价','09:15',false,'B11')}
    ${item('issue','你提交的问题已处理','管理员已补充公司知识：“是否支持私有化部署”','08:40',false,'B5')}
    <div class="day">更早</div>
    ${item('sys','系统通知','发送名片新增“海报”方式，可直接保存发朋友圈','11-10',false,'B4/poster')}
    <div style="height:16px"></div>
  </div></div>`};
};
</script>
<script>/* =========================================================
   原型外壳：导航、手机框、规格说明、设计规范页
   ========================================================= */
const BACK = {A2:'A1',A3:'A2/chat',B3:'B2',B4:'B2',B6:'B5',B7:'B6/list',B8:'B5',B9:'B5',B11:'B10',B13:'B2'};
const SPEC_BY_ID = Object.fromEntries(SPEC.pages.map(p=>[p.id,p]));
const ORDER = SPEC.pages.map(p=>p.id);

function parseHash(){
  const h = (location.hash||'#'+(window.DEFAULT_PAGE||'A1')).slice(1);
  const [id, st] = h.split('/');
  if(id==='S0') return {id:'S0'};
  const p = SPEC_BY_ID[id] || SPEC_BY_ID.A1;
  const states = p.states.map(s=>s[0]);
  return {id:p.id, state: states.includes(st) ? st : states[0]};
}

function renderNav(cur){
  const g = SPEC.groups.map(([gid,gname,gdesc])=>{
    const items = SPEC.pages.filter(p=>p.group===gid).map(p=>{
      const on = cur.id===p.id;
      const states = on && p.states.length>1 ? `<div class="pt-states">${p.states.map(([k,n])=>`<a href="#${p.id}/${k}" class="${cur.state===k?'on':''}">${n}</a>`).join('')}</div>`:'';
      return `<a class="pt-item ${on?'on':''}" href="#${p.id}"><em>${p.id}</em>${p.name}</a>${states}`;
    }).join('');
    return `<div class="pt-group"><div class="pt-gh">${gname}<small>${gdesc}</small></div>${items}</div>`;
  }).join('');
  document.getElementById('pt-nav').innerHTML =
    `<a class="pt-item pt-spec ${cur.id==='S0'?'on':''}" href="#S0"><em>S0</em>设计规范</a>` + g;
}

function renderSpec(cur){
  const p = SPEC_BY_ID[cur.id];
  const li = arr => arr.length?`<ul>${arr.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="pt-none">无</p>';
  document.getElementById('pt-spec').innerHTML = `
    <div class="pt-sh"><em>${p.id}</em><h2>${p.name}</h2></div>
    <div class="pt-route"><span>路由</span><code>${p.route}</code></div>
    <p class="pt-purpose">${p.purpose}</p>
    ${p.states.length>1?`<h4>状态</h4><div class="pt-statebar">${p.states.map(([k,n])=>`<a href="#${p.id}/${k}" class="${cur.state===k?'on':''}">${n}</a>`).join('')}</div>`:''}
    <h4>页面元素</h4>${li(p.elements)}
    <h4>交互</h4>${li(p.interactions)}
    <h4>规则与边界</h4>${li(p.rules)}
    <h4>接口</h4>${p.api.length?`<div class="pt-api">${p.api.map(a=>`<code>${a}</code>`).join('')}</div>`:'<p class="pt-none">无</p>'}`;
}

function renderPhone(cur){
  _pid = 0;
  const r = PAGES_RENDER[cur.id](cur.state);
  const p = SPEC_BY_ID[cur.id];
  const idx = ORDER.indexOf(cur.id);
  document.getElementById('pt-bar').innerHTML = `
    <div class="pt-title"><em>${p.id}</em>${p.name}${p.states.length>1?`<span>${p.states.find(s=>s[0]===cur.state)[1]}</span>`:''}</div>
    <div class="pt-pn"><a href="#${ORDER[(idx-1+ORDER.length)%ORDER.length]}" aria-label="上一页">‹</a><a href="#${ORDER[(idx+1)%ORDER.length]}" aria-label="下一页">›</a></div>`;
  document.getElementById('pt-screen').innerHTML = `
    <div class="sbar ${r.light?'light':''}"><span>9:41</span><span class="sbar-r"><i class="sig"></i><i class="wifi"></i><i class="bat"></i></span></div>
    ${r.html}
    <div class="home-ind ${r.light&&cur.id!=='A1'?'':''}"></div>`;
}

function toast(msg){
  const s = document.getElementById('pt-screen');
  const t = document.createElement('div'); t.className='toast'; t.textContent = msg;
  s.querySelector('.page')?.appendChild(t) || s.appendChild(t);
  setTimeout(()=>t.remove(), 1500);
}

function route(){
  const cur = parseHash();
  document.body.classList.toggle('pt-mode-spec', cur.id==='S0');
  renderNav(cur);
  if(cur.id==='S0'){ renderDesign(); return; }
  renderPhone(cur); renderSpec(cur);
  { const b=document.querySelector('#pt-screen .chat-page .page-body'); if(b && cur.state!=='empty') b.scrollTop=b.scrollHeight; }
  if(window.DEBUG_SCROLL){ const b=document.querySelector('#pt-screen .page-body'); if(b) b.scrollTop=window.DEBUG_SCROLL; }
  document.title = `${cur.id} ${SPEC_BY_ID[cur.id].name}｜数科 AI 智能名片原型`;
}

document.addEventListener('click', e=>{
  const scr = e.target.closest('#pt-screen');
  if(!scr) return;
  const toastEl = e.target.closest('[data-toast]');
  const go = e.target.closest('[data-go]');
  const back = e.target.closest('[data-back]');
  const close = e.target.closest('[data-close]');
  const cur = parseHash();
  if(back){ location.hash = BACK[cur.id] || 'A1'; return; }
  if(close){ location.hash = cur.id === 'B11' ? 'B11' : (cur.id==='A2' ? 'A2/chat' : cur.id + '/' + SPEC_BY_ID[cur.id].states[0][0]); return; }
  if(go && (!toastEl || go.contains(toastEl) || toastEl===go)){
    const msg = toastEl ? toastEl.dataset.toast : null;
    if(location.hash.slice(1)===go.dataset.go){ route(); } else { location.hash = go.dataset.go; }
    if(msg) setTimeout(()=>toast(msg), 30);
    return;
  }
  if(toastEl){ toast(toastEl.dataset.toast); }
});
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);

/* =========================================================
   S0 设计规范页
   ========================================================= */
function renderDesign(){
  const sw = SPEC.tokens.colors.map(([v,hex,name,use])=>`<div class="ds-sw"><i style="background:${hex}${hex.toUpperCase()==='#FFFFFF'?';border:1px solid #E5E9EF':''}"></i><b>${name}</b><code>${v}</code><code>${hex}</code><span>${use}</span></div>`).join('');
  const type = SPEC.tokens.type.map(([v,px,use,w])=>`<div class="ds-type"><span style="font-size:${px}px;font-weight:${w};color:#13294B">名片里的一行字 ${px}</span><code>${v}</code><span>${use}</span></div>`).join('');
  const radius = SPEC.tokens.radius.map(([v,px,use])=>`<div class="ds-rad"><i style="border-radius:${px}px"></i><code>${v} ${px}px</code><span>${use}</span></div>`).join('');
  const rows = SPEC.tokens.vant.map(([a,b])=>`<tr><td><code>${a}</code></td><td><code>${b}</code></td></tr>`).join('');
  const rules = SPEC.tokens.rules.map(r=>`<li>${r}</li>`).join('');
  document.getElementById('pt-design').innerHTML = `
  <div class="app ds">
    <h1>设计规范 S0</h1>
    <p class="ds-lead">所有页面都只能使用以下 tokens 和组件。开发时把颜色、字号、圆角写成 CSS 变量，并映射到 Vant 4 的主题变量；页面中不允许出现规范以外的颜色和圆角。</p>
    <h2>设计原则</h2><ul class="ds-rules">${rules}</ul>
    <h2>颜色</h2><div class="ds-grid">${sw}</div>
    <h2>字号</h2><div>${type}</div>
    <h2>圆角</h2><div class="ds-grid ds-grid-r">${radius}</div>
    <h2>按钮</h2>
    <div class="ds-row"><button class="btn btn-primary btn-lg">和TA聊聊</button><button class="btn btn-primary">发送名片</button><button class="btn btn-ai">试聊</button><button class="btn btn-ink">拨打公司电话</button><button class="btn btn-ghost">编辑名片</button><button class="btn btn-soft btn-sm">更换职业照</button><button class="btn btn-primary disabled">提交</button></div>
    <p class="ds-note">主按钮蓝色（每屏最多一个）；青绿只用于 AI 相关操作；深蓝用于停用页等品牌兜底；描边按钮用于次要操作；高度 48 / 40 / 30。</p>
    <h2>标签与等级</h2>
    <div class="ds-row"><span class="tag tag-ai">AI</span><span class="tag tag-primary">已联系</span><span class="tag tag-amber">新线索</span><span class="tag tag-success">已转化</span><span class="tag tag-gray">NFC 碰一碰</span><span class="tag tag-danger">未命中</span><span class="lv lv-A">A</span><span class="lv lv-B">B</span><span class="lv lv-C">C</span><span class="st st-new">新线索</span><span class="st st-contacted">已联系</span><span class="st st-converted">已转化</span><span class="st st-invalid">无效</span></div>
    <p class="ds-note">意向等级：A 橙底白字（唯一使用实心橙的地方），B 蓝浅底，C 灰。线索状态用圆角胶囊。</p>
    <h2>胶囊与分段</h2>
    <div class="ds-row"><span class="chip on">全部</span><span class="chip">新线索 2</span><span class="chip">已联系</span></div>
    <div style="max-width:360px;margin-top:12px"><div class="seg" style="margin:0"><span class="on">二维码</span><span>海报</span><span>链接</span></div></div>
    <h2>对话气泡</h2>
    <div class="ds-chat"><div class="chat" style="padding:0">${aiMsg('支持。可以部署在客户自有机房或私有云。')}${meMsg('产品 A 支持私有化部署吗？')}</div></div>
    <p class="ds-note">AI 气泡白底、左上直角、顶部“AI”标识（青绿）；访客气泡主色蓝、右上直角；流式输出末尾青绿光标。</p>
    <h2>图标</h2>
    <div class="ds-icons">${Object.keys(IC).map(k=>`<div>${ic(k,'s24')}<span>${k}</span></div>`).join('')}</div>
    <p class="ds-note">线性图标，24 视窗，线宽 1.8，圆角端点。开发使用 lucide 图标库（lucide-vue-next）中同名或最接近的图标，不混用面性图标。</p>
    <h2>Vant 4 主题变量映射</h2>
    <table class="ds-table"><thead><tr><th>Vant 变量</th><th>取值</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}
</script>
</body>
</html>
